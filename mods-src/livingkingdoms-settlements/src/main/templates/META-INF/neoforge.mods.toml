modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Living Kingdoms settlements: villages of MCA Reborn residents that work, build and grow.
'''

# One Mixin into MCA Reborn: the place where a villager's brain is built (ADR-0030).
[[mixins]]
    config="livingkingdoms_settlements.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="livingkingdoms_core"
    type="required"
    versionRange="[0.0.1,)"
    ordering="AFTER"
    side="BOTH"

# 7.7.35 changed MCA's save format; 8.x is a different code line (docs/references/mca-reborn-7.7.md).
[[dependencies.${mod_id}]]
    modId="mca"
    type="required"
    versionRange="[7.7.35,8)"
    ordering="AFTER"
    side="BOTH"
