modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Living Kingdoms world: fixed world sizes, bounded dimensions and the finite-world edge.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="livingkingdoms_core"
    type="required"
    versionRange="[0.0.1,)"
    ordering="AFTER"
    side="BOTH"

# Loaded after the Twilight Forest so our override of its dimension type wins (ADR-0004: TF 1:1).
[[dependencies.${mod_id}]]
    modId="twilightforest"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
