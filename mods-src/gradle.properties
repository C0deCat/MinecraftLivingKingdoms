# Shared by every mod project. Mod-specific values live in <project>/gradle.properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment mappings: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Must equal MINECRAFT_VERSION / NEOFORGE_VERSION in tools/pack/src/pins.ts.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.265
loader_version_range=[1,)

# License of our mods is not chosen yet (docs/licenses.md).
mod_license=All Rights Reserved (placeholder, see docs/licenses.md)
