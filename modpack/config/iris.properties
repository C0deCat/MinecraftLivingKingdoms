# Iris settings shipped with Living Kingdoms (M1-C2): Complementary Reimagined is the default shader pack.
# Preserved by packwiz-installer: a player who picks another pack or turns shaders off keeps that choice.
allowUnknownShaders=false
colorSpace=SRGB
disableUpdateMessage=false
enableDebugOptions=false
enableShaders=true
maxShadowRenderDistance=32
shaderPack=ComplementaryReimagined_r5.9.3.zip
